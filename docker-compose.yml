# Plant Disease Detection System — see decisions/0006-docker-compose-topology.md
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
      - ./backend/models:/app/models
      - ./ml:/ml:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    depends_on:
      - backend

  ngrok:
    image: ngrok/ngrok:alpine
    profiles: ["public"]
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    # $$ defers expansion to the container shell, so --url is only passed when NGROK_DOMAIN is set
    entrypoint: ["/bin/sh", "-c"]
    command: ["exec ngrok http frontend:80 --log stdout $${NGROK_DOMAIN:+--url=$$NGROK_DOMAIN}"]
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      - frontend

volumes:
  pgdata:
  uploads:
